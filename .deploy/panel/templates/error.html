{% extends "base.html" %}
{% block title %}出错了 · RustDesk 服务端面板{% endblock %}
{% block content %}
<div class="card">
  <h1>出错了</h1>
  <p class="subtitle">HTTP {{ error.code if error.code else 500 }}</p>
  <pre class="mono">{{ error }}</pre>
  <div class="actions">
    <a class="btn" href="{{ url_for('index') }}">回到仪表盘</a>
  </div>
</div>
{% endblock %}
